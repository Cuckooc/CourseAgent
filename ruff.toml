# 代码质量门禁（ruff 0.14）
# 运行：ruff check .
line-length = 100
target-version = "py38"

[lint]
# E4 缩进/空行类、E7 语句类、E9 运行时语法错误、F pyflakes（未定义名/未用导入）
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# 手工测试脚本存在路径 hack 式导入顺序，不纳入 E402 检查
"service/test.py" = ["E402"]
"multi_agent/test.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"app/infrastructure/document/file.py" = ["E402"]
