# Prometheus 抓取与告警评估配置（docker-compose.yml prometheus 服务挂载）
# UI：http://127.0.0.1:9090（compose 仅绑定宿主机回环，公网访问需反代+鉴权）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # 后端多 worker（4 进程）各自暴露 /metrics，Prometheus 自动聚合
  - job_name: course-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
