[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    backend: 需要后端 :8000 在线的用例
    slow: 真实 LLM/向量库/MySQL 的端到端用例（默认不跑）
    db: 需要 MySQL 数据库连通的用例
# tests/phase/ 为脚本式用例（模块导入即执行 + sys.exit 退出码），
# 被 pytest 收集会触发 INTERNALERROR，故显式忽略；
# 这些用例用 `python tests/phase/test_xxx.py` 直接运行。
addopts =
    -m "not slow"
    --strict-markers
    -ra
    --ignore=tests/phase
